<title>Rincón Fit — Rutina, dieta y evolución a tu medida</title>
<meta name="description" content="Genera tu rutina de gimnasio y tu dieta según tu objetivo (perder peso, definir o ganar masa), y guarda la evolución de tu peso y tus medidas a lo largo del tiempo.">
<meta name="robots" content="noindex">

<style>
  :root {
    --bg: #0b0d11;
    --panel: #171b21;
    --panel-2: #1e232b;
    --border: #2a303a;
    --text: #eef1f5;
    --muted: #9aa4b2;
    --accent: #5b8def;
    --accent-dim: #3f63c9;
    --accent-2: #7bb661;
    --warn: #e0a845;
    --bad: #e0645b;
    --radius: 14px;
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.28);
    --shadow-md: 0 8px 24px rgba(0,0,0,0.35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(720px 420px at 15% -8%, rgba(91,141,239,0.16), transparent 60%),
      radial-gradient(640px 380px at 100% 0%, rgba(123,182,97,0.10), transparent 55%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  #app { max-width: 960px; margin: 0 auto; padding: 16px 16px calc(92px + env(safe-area-inset-bottom, 0px)); }
  h1, h2, h3, h4 { line-height: 1.2; margin: 0 0 8px; }
  h4 { font-size: 1em; margin-top: 18px; }
  p { margin: 0 0 12px; color: var(--text); }
  .muted { color: var(--muted); font-size: 0.92em; }
  a { color: var(--accent); }

  /* Auth / onboarding */
  .auth-card, .onboarding-card {
    max-width: 420px;
    margin: 8vh auto 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 24px;
    box-shadow: var(--shadow-md);
  }
  .onboarding-card { max-width: 520px; }
  .lead { color: var(--muted); margin-bottom: 20px; }
  .tabs-mini { display: flex; gap: 8px; margin-bottom: 18px; }
  .tab-mini {
    flex: 1; padding: 8px; border-radius: 8px; border: 1px solid var(--border);
    background: transparent; color: var(--muted); cursor: pointer; font-size: 0.95em;
  }
  .tab-mini.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .link-btn {
    display: block; margin-top: 14px; padding: 0; background: none; border: none;
    color: var(--accent); text-decoration: underline; font-size: 0.9em; cursor: pointer;
  }
  .link-btn[hidden] { display: none; }

  form label { display: block; margin-bottom: 14px; font-size: 0.92em; color: var(--muted); }
  form label.full { grid-column: 1 / -1; }
  form label[hidden] { display: none; }
  form input, form select {
    width: 100%; margin-top: 4px; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text); font-size: 1em;
  }
  form input:focus, form select:focus, form textarea:focus { outline: 2px solid var(--accent); }
  form textarea {
    width: 100%; margin-top: 4px; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    font-size: 1em; font-family: inherit; resize: vertical;
  }
  fieldset { border: 1px solid var(--border); border-radius: 8px; margin: 0 0 14px; padding: 10px 12px; }
  fieldset legend { padding: 0 6px; color: var(--muted); font-size: 0.9em; }
  label.radio { display: inline-flex; align-items: center; gap: 6px; margin-right: 16px; color: var(--text); }
  label.radio input { width: auto; margin: 0; }

  .btn-primary, .btn-secondary, .btn-ghost, .btn-danger {
    cursor: pointer; border-radius: 11px; padding: 11px 16px; font-size: 0.95em; border: 1px solid transparent;
    transition: transform 0.08s ease, filter 0.15s ease, background 0.15s ease;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-dim));
    color: #fff; width: 100%; font-weight: 600; box-shadow: 0 4px 14px rgba(91,141,239,0.35);
  }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-primary:active { transform: translateY(1px); }
  .btn-secondary { background: var(--panel-2); color: var(--text); border-color: var(--border); }
  .btn-secondary:hover { border-color: var(--accent); }
  .btn-ghost { background: transparent; color: var(--muted); border-color: var(--border); }
  .btn-ghost:hover { color: var(--text); border-color: var(--accent); }
  .btn-ghost.btn-sm { padding: 4px 10px; font-size: 0.85em; }
  .btn-ghost.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-danger { background: transparent; color: var(--bad); border-color: var(--bad); }
  .field-error { color: var(--bad); font-size: 0.9em; }
  .field-ok { color: var(--accent-2); font-size: 0.9em; }

  /* App shell */
  .app-header {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 16px;
    padding: 14px 16px; margin: 0 -16px 16px;
    background: rgba(11,13,17,0.86); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .brand {
    font-weight: 800; font-size: 1.2em; margin-right: auto;
    display: flex; align-items: center; gap: 8px; letter-spacing: -0.01em;
  }
  .brand-mark {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; border-radius: 9px; font-size: 0.95em;
    background: linear-gradient(135deg, var(--accent), var(--accent-dim));
    box-shadow: 0 2px 8px rgba(91,141,239,0.4);
  }
  /* Barra de navegación inferior (estilo app móvil) */
  .bottom-nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    display: flex; justify-content: space-around;
    background: rgba(17,20,26,0.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid var(--border);
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
    box-shadow: 0 -6px 20px rgba(0,0,0,0.3);
  }
  .bottom-nav .tab {
    flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px;
    background: transparent; border: none; color: var(--muted);
    padding: 6px 2px; border-radius: 12px; cursor: pointer; font-size: 0.68em;
    line-height: 1.2;
  }
  .bottom-nav .tab .tab-icon {
    font-size: 1.35em; width: 40px; height: 30px; display: flex; align-items: center; justify-content: center;
    border-radius: 999px; transition: background 0.15s ease, color 0.15s ease;
  }
  .bottom-nav .tab .tab-label {
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .bottom-nav .tab.active { color: var(--text); }
  .bottom-nav .tab.active .tab-icon { background: var(--accent); color: #fff; }

  @media (min-width: 720px) {
    .bottom-nav {
      position: static; margin: 0 0 20px; justify-content: flex-start; gap: 6px;
      background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 8px; box-shadow: var(--shadow-sm);
    }
    .bottom-nav .tab {
      flex: 0 0 auto; flex-direction: row; gap: 8px; font-size: 0.9em; padding: 8px 16px; border-radius: 10px;
    }
    .bottom-nav .tab .tab-icon { font-size: 1.1em; width: auto; height: auto; border-radius: 0; }
    .bottom-nav .tab.active { background: var(--panel-2); }
    .bottom-nav .tab.active .tab-icon { background: transparent; color: inherit; }
    #app { padding-bottom: 40px; }
  }

  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px; margin-bottom: 18px; box-shadow: var(--shadow-sm);
  }
  .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

  .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .stat-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; display: flex; flex-direction: column; gap: 6px; box-shadow: var(--shadow-sm);
  }
  .stat-label { color: var(--muted); font-size: 0.85em; text-transform: uppercase; letter-spacing: 0.03em; }
  .stat-value { font-size: 1.6em; font-weight: 700; }
  .stat-value-sm { font-size: 1.1em; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.8em; width: fit-content; }
  .badge.good { background: rgba(123,182,97,0.18); color: var(--accent-2); }
  .badge.warn { background: rgba(224,168,69,0.18); color: var(--warn); }
  .badge.bad { background: rgba(224,100,91,0.18); color: var(--bad); }

  .chart-svg { width: 100%; height: auto; }
  .chart-axis { stroke: var(--border); stroke-width: 1; }
  .chart-delta { color: var(--muted); font-size: 0.88em; margin: 4px 0 0; }
  .chart-empty { color: var(--muted); font-style: italic; }

  .routine-day { margin-bottom: 22px; }
  .routine-day:last-child { margin-bottom: 0; }
  .routine-day-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0; }
  .day-pill {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--muted);
    padding: 7px 12px; border-radius: 999px; cursor: pointer; font-size: 0.85em;
  }
  .day-pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .weekday-plan-toggle { margin: 4px 0 0; }
  .weekday-plan-form {
    margin-top: 12px; padding: 14px; border: 1px solid var(--border); border-radius: 12px;
    background: var(--panel-2);
  }
  .weekday-plan-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 6px 0; border-bottom: 1px solid var(--border);
  }
  .weekday-plan-row:last-of-type { border-bottom: none; }
  .weekday-plan-row span { flex-shrink: 0; width: 90px; font-weight: 600; }
  .weekday-plan-row select { flex: 1 1 auto; }
  .weekday-plan-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  .table-scroll { overflow-x: auto; }
  .routine-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  .routine-table th, .routine-table td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .routine-table th { color: var(--muted); font-weight: 600; font-size: 0.85em; }

  /* Fila de ejercicio: foto a la izquierda, nombre/series en el centro,
     zona muscular a la derecha — toda la fila abre el detalle completo. */
  .exercise-row-list { margin-top: 10px; }
  .exercise-row {
    display: flex; align-items: center; gap: 12px; padding: 12px 4px;
    border-bottom: 1px solid var(--border);
  }
  .exercise-row:last-child { border-bottom: none; }
  .exercise-row-thumb {
    flex-shrink: 0; width: 60px; height: 60px; padding: 0; border: none; border-radius: 12px;
    overflow: hidden; background: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .exercise-thumb-img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .exercise-thumb-fallback { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .exercise-thumb-fallback .movement-svg { width: 90%; height: 90%; }
  .exercise-row-main { flex: 1; min-width: 0; }
  .exercise-row-name.exercise-link {
    display: block; width: 100%; white-space: normal; text-decoration: none;
  }
  .exercise-row-meta {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    color: var(--muted); font-size: 0.85em; margin: 4px 0;
  }
  .exercise-row-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .exercise-row-muscle, .muscle-diagram-mini {
    flex-shrink: 0; width: 52px; text-align: center; color: var(--muted); font-size: 0.68em;
  }
  .muscle-diagram-mini-svg { width: 38px; height: auto; }
  .muscle-diagram-mini span { display: block; margin-top: 2px; line-height: 1.2; }

  .exercise-row-compact .exercise-row-thumb { width: 48px; height: 48px; }

  .stretch-section summary { list-style: none; cursor: pointer; }
  .stretch-section summary::-webkit-details-marker { display: none; }
  .stretch-summary {
    font-family: inherit; font-weight: 700; font-size: 1.08em; color: var(--text);
    display: flex; align-items: center; gap: 6px;
  }
  .stretch-summary::before { content: '▸'; color: var(--muted); font-size: 0.8em; transition: transform 0.15s ease; }
  .stretch-section[open] .stretch-summary::before { transform: rotate(90deg); }
  .stretch-section h4 { margin-top: 16px; }

  .measure-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 4px 16px; }

  .extra-exercise-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
  .extra-exercise-row select { flex: 1 1 220px; }

  .danger-zone { border-color: var(--bad); }

  .exercise-link {
    background: none; border: none; padding: 0; color: var(--text); font-weight: 700;
    font-size: 1em; cursor: pointer; text-align: left; text-decoration: underline dotted;
  }
  .exercise-link:hover { color: var(--accent); }

  .level-bars { display: inline-flex; gap: 3px; margin: 4px 0; vertical-align: middle; }
  .level-bar { width: 14px; height: 5px; border-radius: 3px; background: var(--border); display: inline-block; }
  .level-bar.filled { background: var(--accent); }

  .exercise-detail-head { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; margin: 14px 0 18px; }
  .exercise-visuals { display: flex; gap: 16px; flex-wrap: wrap; }
  .muscle-diagram-wrap, .movement-anim { flex-shrink: 0; width: 140px; }
  .muscle-diagram, .movement-svg { width: 100%; height: auto; }
  .photo-credit { margin-top: -8px; font-size: 0.8em; }

  .photo-loop {
    position: relative; flex-shrink: 0; width: 220px; aspect-ratio: 3 / 2;
    border-radius: var(--radius); overflow: hidden; background: var(--panel-2);
  }
  .photo-frame {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    animation: photoCrossfade 2.4s ease-in-out infinite;
  }
  .photo-frame-a { animation-delay: 0s; }
  .photo-frame-b { animation-delay: -1.2s; }
  @keyframes photoCrossfade { 0%, 45% { opacity: 1; } 55%, 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .photo-frame { animation: none; }
    .photo-frame-b { opacity: 0; }
  }

  @keyframes animPush { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
  @keyframes animPull { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(18px); } }
  @keyframes animSquat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(10px); } }
  @keyframes animRaise { 0%, 100% { transform: rotate(70deg); } 50% { transform: rotate(0deg); } }
  @keyframes animCore { 0%, 100% { transform: scale(1); opacity: .85; } 50% { transform: scale(1.06); opacity: 1; } }
  @keyframes animLegA { 0%, 100% { transform: rotate(-16deg); } 50% { transform: rotate(16deg); } }
  @keyframes animLegB { 0%, 100% { transform: rotate(16deg); } 50% { transform: rotate(-16deg); } }

  .anim-push { animation: animPush 1.4s ease-in-out infinite; }
  .anim-pull { animation: animPull 1.4s ease-in-out infinite; }
  .anim-squat { animation: animSquat 2s ease-in-out infinite; }
  .anim-raise {
    animation: animRaise 1.8s ease-in-out infinite;
    transform-box: fill-box; transform-origin: 50% 0%;
  }
  .anim-core { animation: animCore 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
  .anim-cardio-a {
    animation: animLegA 1.1s ease-in-out infinite;
    transform-box: fill-box; transform-origin: 100% 0%;
  }
  .anim-cardio-b {
    animation: animLegB 1.1s ease-in-out infinite;
    transform-box: fill-box; transform-origin: 0% 0%;
  }

  @media (prefers-reduced-motion: reduce) {
    .anim-push, .anim-pull, .anim-squat, .anim-raise, .anim-core, .anim-cardio-a, .anim-cardio-b { animation: none; }
  }

  .steps-list { padding-left: 20px; margin: 0 0 14px; }
  .steps-list li { margin-bottom: 8px; }

  .tip-box {
    background: rgba(224,168,69,0.12); border: 1px solid var(--warn); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 16px;
  }
  .tip-box.warn-box { background: rgba(224,100,91,0.12); border-color: var(--bad); }

  .exercise-detail h3 { margin-top: 22px; }

  .cal-weekdays, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
  .cal-weekdays { color: var(--muted); font-size: 0.8em; margin: 10px 0 6px; }
  .cal-cell {
    aspect-ratio: 1; border-radius: 8px; border: 1px solid var(--border); background: var(--panel-2);
    color: var(--text); cursor: pointer; font-size: 0.9em; position: relative;
  }
  .cal-cell.cal-empty { border: none; background: transparent; cursor: default; }
  .cal-cell.cal-today { border-color: var(--accent); }
  .cal-cell.cal-selected { background: var(--accent); color: #fff; }
  .cal-cell.cal-active::after {
    content: ''; position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
    width: 5px; height: 5px; border-radius: 50%; background: var(--accent-2);
  }
  .cal-cell.cal-selected.cal-active::after { background: #fff; }

  @media (max-width: 560px) {
    .app-header { gap: 10px; }
    .stat-value { font-size: 1.3em; }
  }

  .diet-day-block { margin: 22px 0; padding-top: 18px; border-top: 1px solid var(--border); }
  .diet-day-block:first-of-type { margin-top: 6px; }

  @media print {
    :root {
      --bg: #fff; --panel: #fff; --panel-2: #f4f5f7; --text: #111; --muted: #555; --border: #ccc;
    }
    body { background: #fff; }
    .app-header, .bottom-nav, .no-print { display: none !important; }
    .app-main { padding-bottom: 0; }
    .panel { box-shadow: none; border: none; padding: 0; margin: 0 0 18px; break-inside: avoid; }
    .diet-day-block { break-inside: avoid; }
    .routine-table th, .routine-table td { border-color: #ccc; }
    a[href]::after { content: none; }
  }
</style>
</head>
<body>
  <div id="app">
    <p class="muted" style="text-align:center;padding-top:40px;">Cargando…</p>
  </div>
  <script>
    // Si la app no ha arrancado en unos segundos (p. ej. sin conexión y no
    // pudo cargar Supabase desde el CDN), avisamos en lugar de dejar el
    // "Cargando…" colgado para siempre.
    window.__gymLoadTimeout = setTimeout(function () {
      var app = document.getElementById('app');
      if (app && app.dataset.ready !== '1') {
        app.innerHTML = '<p class="muted" style="text-align:center;padding-top:40px;">'
          + 'No se ha podido cargar la aplicación. Comprueba tu conexión a internet y recarga la página.</p>';
      }
    }, 8000);
  </script>
  <script type="module" src="./assets/gym-app.js"
          onerror="document.getElementById('app').innerHTML='<p class=&quot;muted&quot; style=&quot;text-align:center;padding-top:40px;&quot;>No se ha podido cargar la aplicación. Comprueba tu conexión a internet y recarga la página.</p>'"></script>
</body>
</html>
